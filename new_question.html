
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question project new question</title>

    <link rel="stylesheet" href="static/base.css">

<body>
    <header>
        <h3>
            <a href="index.html">AskPupkin</a>
        </h3>
        <input type="text" class="search" placeholder="Search">
        <button class="ask">Ask</button>
        <div class="profile">
            <a href="login.html">log in</a>
            <a href="register.html">register</a>
        </div>
    </header>

    <hr class="smth_cool">

    <div class="root">
        <main>
            <section class="new_question">
                <h3>New Question</h3>
            </section>
            <form action="/api/question", method="post">
                <section class="form">
                    <ul>
                        <li>
                            <span>Title</span>
                            <div>
                                <input name="title" placeholder="Title" required>
                                <div class="error-message" data-field="title"></div>
                            </div>
                        </li>
                        <li class="question_text">
                            <span>Text</span>
                            <div>
                                <textarea name="content" class="question_text_box" placeholder="Question Text"></textarea>
                                <div class="error-message" data-field="title"></div>
                            </div>
                        </li>
                        <li>
                            <span>Tags</span>
                            <div>
                                <input name="tags" placeholder="Tags" required>
                                <div class="error-message" data-field="title"></div>
                            </div>
                        </li>
                        <li>
                            <span></span>
                            <button type="submit" class="finale_ask">ASK!</button>
                        </li>
                    </ul>
                </section>
            </form>
        </main>
    
        <aside>
            <section class="popular_tags">

                    </li>

                    </li>
                </ul>
            </section>
            <section class="best_members">
                <h3>Best Members</h3>
                <ul class="best_members-list">
