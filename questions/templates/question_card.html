{% load static index %}
<section class="content">
    <div class="leftside">
        <img src="{% static 'questions/img/avatar.jpg' %}" alt="question ava {{ inst.id }}" class="question-avatar">
        <!-- <input type="number" class="likes" min="0"> -->
        {% include "likes.html" with like=inst %}
    </div>
    <div class="info" data-id={{ inst.id }}>
        
        <a href="{% url "question_view" inst.id %}" class="info_title">{{ inst.text }}</a>
        <div class="info_text">
            {{ question.description|truncate_str:150 }}
        </div>
        <div class="info_footer">
            <span>answer (3)</span>
            <div class="tag">
                <span>Tags:</span>
                <a href="{% url "tag_view" "black-jack" %}" class="black_jack">black-jack</a>
                <a href="{% url "tag_view" "bender" %}" class="bender">bender</a>
            </div>
        </div>
    </div>
</section>
