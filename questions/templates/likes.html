<div class="likes-container" 
     data-id="{{ like.id }}" 
     data-type="{{ type|default:'question' }}">
    <button type="button" class="like-btn {% if like.user_reaction == 'like' %}active{% endif %}">+</button>
    <input type="number" class="likes-count" value="{{ like.likes_count }}" readonly>
    <input type="number" class="dislikes-count" value="{{ like.dislikes_count }}" readonly>
    <button type="button" class="dislike-btn {% if like.user_reaction == 'dislike' %}active{% endif %}">-</button>
</div>
